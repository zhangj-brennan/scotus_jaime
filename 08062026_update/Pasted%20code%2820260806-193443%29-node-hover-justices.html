<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supreme Court Education Sankeys</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
      <link rel="stylesheet" href="style.css">
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    -webkit-text-size-adjust: 100%;
  }

  body {
    color: #000;
    font-family: "Benton Sans", Helvetica, Arial, sans-serif;
    font-size: 12px;
    line-height: 1.35;
    background: #fff;
    margin: 10px;
    padding-top: 10px;
    border-top: 2px solid #000;
      max-width:800px;
}

 .wrap {
  max-width: 800px;
  width: calc(100% - 40px);
  margin: 0 auto;
  padding: 40px 0 60px;
}

  .hero {
    margin: 0 0 20px;
    padding: 0;
  }

  .hero-kicker {
    display: none;
  }

  .hero h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.08;
    font-weight: 700;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .chart-card {
    margin: 0;
    padding: 0;
    border: 0;
  }

  .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px 16px;
    flex-wrap: wrap;
    margin: 0 0 8px;
    padding: 0;
  }

  .chart-title {
    margin: 0;
    font-size: 14px;
    line-height: 1.15;
    font-weight: 700;
  }

  .chart-meta {
    color: #666;
    font-size: 11px;
    line-height: 1.25;
  }

  .chart-frame {
    width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: auto;
    overflow-y: hidden;
  }

  svg {
    display: block;
    background: #fff;
  }

  .node rect {
    stroke: rgba(0, 0, 0, 0.15);
    shape-rendering: crispEdges;
  }

  .node text {
    font-family: "Benton Sans", Helvetica, Arial, sans-serif;
    font-size: 11px;
    fill: #111;
  }

  .link {
    fill: none;
    stroke-opacity: 0.35;
    mix-blend-mode: multiply;
  }

  .link {
    transition: stroke-opacity 120ms ease, stroke-width 120ms ease;
  }

  .link.is-dimmed {
    stroke-opacity: 0.08;
  }

  .link.is-highlighted {
    stroke-opacity: 0.9;
  }

  .col-label {
    font-family: "Benton Sans", Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    fill: #666;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .tooltip {
    position: fixed;
    pointer-events: none;
    width: max-content;
    max-width: min(320px, calc(100vw - 20px));
    background: #fff;
    color: #000;
    border: 1px solid #000;
    padding: 8px 10px;
    border-radius: 0;
    font-family: "Benton Sans", Helvetica, Arial, sans-serif;
    font-size: 12px;
    line-height: 1.35;
    opacity: 0;
    transition: opacity 120ms ease;
    z-index: 10;
  }

  @media (max-width: 700px) {
    body {
      margin: 8px;
      padding-top: 8px;
    }

    .hero {
      margin-bottom: 16px;
    }

    .chart-grid {
      gap: 16px;
    }

    .chart-head {
      display: block;
      margin-bottom: 6px;
    }

    .chart-meta {
      margin-top: 3px;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-kicker">Supreme Court</div>
      <h1>Justice Education Sankeys</h1>
    </section>

    <section class="chart-grid" id="chartGrid"></section>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const chartData = [
      {
        key: 'current_2026',
        title: 'CURRENT COURT MARCH 2026',
        color: '#ED1C24',
        rows: [
          ['John G. Roberts, Jr.', 'Harvard College (B.A.)', 'Harvard Law School (J.D.)'],
          ['Ketanji Brown Jackson', 'Harvard-Radcliffe College (B.A.)', 'Harvard Law School (J.D.)'],
          ['Neil M. Gorsuch', 'Columbia University (B.A.)', 'Harvard Law School (J.D.)'],
          ['Samuel A. Alito, Jr.', 'Princeton University', 'Yale Law School (J.D.)'],
          ['Sonia Sotomayor', 'Princeton University (B.A.)', 'Yale Law School (J.D.)'],
          ['Elena Kagan', 'Princeton University (B.A.)', 'Harvard Law School (J.D.)'],
          ['Clarence Thomas', 'College of the Holy Cross (B.A.)', 'Yale Law School (J.D.)'],
          ['Brett M. Kavanaugh', 'Yale College (B.A.)', 'Yale Law School (J.D.)'],
          ['Amy Coney Barrett', 'Rhodes College (B.A.)', 'Notre Dame Law School (J.D.)']
        ]
      },
      {
        key: 'march_2001',
        title: 'March 2001 Supreme Court',
        color: '#3995B2',
        rows: [
          ['William Rehnquist', 'Stanford University (B.A.)', 'Stanford Law School (LL.B)'],
          ["Sandra Day O'Connor", 'Stanford Unviersity (A.B.)', 'Stanford Law School (LL.B)'],
          ['Anthony Kennedy', 'Stanford University (B.A.)', 'Harvard Law School (J.D.)'],
          ['Stephen Breyer', 'Stanford University (A.B.)', 'Harvard Law School (LL.B)'],
          ['Antonin Scalia', 'Georgetown College (B.A.)', 'Harvard Law School (LL. B)'],
          ['David Souter', 'Harvard College (B.A.)', 'Harvard Law School (LL.B)'],
          ['Ruth Bader Ginsburg', 'Cornell University (A.B.)', 'Harvard Law School; Columbia Law School (LL.B)'],
          ['John Paul Stevens', 'University of Chicago (B.A.)', 'Northwestern University School of Law (J.D.)'],
          ['Clarence Thomas', 'College of the Holy Cross (B.A.)', 'Yale Law School (J.D.)']
        ]
      },
      {
        key: 'march_1976',
        title: 'March 1976 Supreme Court',
        color: '#FFCF01',
        rows: [
          ['Warren E. Burger', '', 'St. Paul College of Law (LL.B)'],
          ['Thurgood Marshall', 'Lincoln University (A.B.)', 'Howard University School of Law (LL.B)'],
          ['Byron White', 'University of Colorado (B.A.)', 'Yale Law School (LL.B)'],
          ['Potter Stewart', 'Yale University (B.A.)', 'Yale Law School (LL.B)'],
          ['William J Brennan Jr.', 'University of Pennsylvania (B.S.)', 'Harvard Law School (LL.B)'],
          ['Harry Blackmun', 'Harvard College (A.B.)', 'Harvard Law School (LL.B)'],
          ['Lewis F Powell Jr.', 'Washington and Lee University (B.S.)', 'Washington and Lee University School of Law (LL.B)'],
          ['William Rehnquist', 'Stanford University (B.A.)', 'Stanford Law School (LL.B)'],
          ['John Paul Stevens', 'University of Chicago (B.A.)', 'Northwestern University School of Law (J.D.)']
        ]
      },
      {
        key: 'march_1951',
        title: 'March 1951 Supreme Court',
        color: '#767c7d',
        rows: [
          ['Fred M Vinson', 'Centre College (B.A.)', 'College of Law of Central University (LL.B)'],
          ['Tom C Clark', 'University of Texas (A.B.)', 'University of Texas School of Law (LL.B.)'],
          ['Sherman Minton', '', 'Indiana University School of Law (LL.B); Yale Law School (LL.M)'],
          ['Robert H Jackson', '', 'Albany Law School'],
          ['Hugo Black', '', 'University of Alabama School of Law (LL.B.)'],
          ['Harold H Burton', 'Bowdoin College (A.B.)', 'Harvard Law School (LL.B.)'],
          ['Felix Frankfurter', 'City College of New York (B.A.)', 'Harvard Law School (LL.B.)'],
          ['William O Douglas', 'Whitman College (A.B.)', 'Columbia Law School (LL.B.)'],
          ['Stanley Forman Reed', 'Kentucky Wesleyan College (B.A.)', 'Columbia Law School; University of Virginia School of Law']
        ]
      }
    ];

    const COLLEGE_ALIASES = new Map([
      ['Harvard College', 'Harvard College'],
      ['Harvard-Radcliffe College', 'Harvard College'],
      ['Princeton University', 'Princeton University'],
      ['Stanford University', 'Stanford University'],
      ['Stanford Unviersity', 'Stanford University'],
      ['Yale College', 'Yale University'],
      ['Yale University', 'Yale University']
    ]);

    const tooltip = d3.select('#tooltip');

    chartData.forEach(config => {
      renderEducationSankey('#chartGrid', config);
    });

    function renderEducationSankey(containerSelector, config) {
      const width = 800;
      const height = 350;
      const margin = { top: 26, right: 200, bottom: 16, left: 0 };
      const endpointLabel = 'Supreme Court';

      const container = d3.select(containerSelector)
        .append('article')
        .attr('class', 'chart-card');

      const graph = buildSankeyGraph(config.rows, endpointLabel);

      container.append('div')
        .attr('class', 'chart-head')
        .html(`
          <h2 class="chart-title">${config.title}</h2>
          <div class="chart-meta">${graph.justiceCount} justices · ${graph.collegeCount} colleges · ${graph.lawSchoolCount} law schools</div>
        `);

      const frame = container.append('div').attr('class', 'chart-frame');
      const svg = frame.append('svg')
        .attr('width', width)
        .attr('height', height);

      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const sankey = d3.sankey()
        .nodeId(d => d.id)
        .nodeWidth(6)
        .nodePadding(20)
        .nodeAlign(d3.sankeyJustify)
        .extent([[0, 20], [innerWidth, innerHeight - 10]])
        .nodeSort((a, b) => d3.ascending(a.order, b.order))
        .linkSort((a, b) => d3.ascending(a.personOrder, b.personOrder));

      const sankeyGraph = sankey({
        nodes: graph.nodes.map(d => ({ ...d })),
        links: graph.links.map(d => ({ ...d }))
      });

      const nodeScale = 1;

      sankeyGraph.nodes.forEach(d => {
        const h = d.y1 - d.y0;
        const newH = Math.max(8, h * nodeScale);
        const center = (d.y0 + d.y1) / 2;

        d.y0 = center - newH / 2;
        d.y1 = center + newH / 2;
      });

      drawColumnLabels(g, innerWidth);

      const links = g.append('g')
        .selectAll('path')
        .data(sankeyGraph.links)
        .join('path')
        .attr('class', 'link')
        .attr('d', d3.sankeyLinkHorizontal())
        .attr('stroke', d => linkColor(d, config.color))
        .attr('stroke-width', d => Math.max(0.6, d.width * 0.7))
        .on('mouseenter', (event, d) => {
          links
            .classed('is-highlighted', link => link.justice === d.justice)
            .classed('is-dimmed', link => link.justice !== d.justice)
            .attr('stroke-width', link =>
              link.justice === d.justice
                ? Math.max(1.8, link.width * 1.15)
                : Math.max(0.6, link.width * 0.7)
            );

          showTooltip(
            event,
            `<strong>${sanitizeLabel(d.justice)}</strong><br>` +
            `${sanitizeLabel(d.flowLabel)}`
          );
        })
        .on('mousemove', moveTooltip)
        .on('mouseleave', () => {
          links
            .classed('is-highlighted', false)
            .classed('is-dimmed', false)
            .attr('stroke-width', link => Math.max(0.6, link.width * 0.7));

          hideTooltip();
        });

      const node = g.append('g')
        .selectAll('g')
        .data(sankeyGraph.nodes)
        .join('g')
        .attr('class', 'node');

      node.append('rect')
        .attr('x', d => d.x0)
        .attr('y', d => d.y0)
        .attr('height', d => Math.max(1, d.y1 - d.y0))
        .attr('width', d => d.x1 - d.x0)
        .attr('fill', d => nodeColor(d, config.color))
        .on('mouseenter', (event, d) => {
          const connectedJustices = Array.from(new Set(
            sankeyGraph.links
              .filter(link => link.source.id === d.id || link.target.id === d.id)
              .map(link => link.justice)
          )).sort(d3.ascending);

          links
            .classed('is-highlighted', link => connectedJustices.includes(link.justice))
            .classed('is-dimmed', link => !connectedJustices.includes(link.justice))
            .attr('stroke-width', link =>
              connectedJustices.includes(link.justice)
                ? Math.max(1.8, link.width * 1.15)
                : Math.max(0.6, link.width * 0.7)
            );

          const typeLabel =
            d.type === 'justice' ? 'Justice' :
            d.type === 'college' ? 'College' :
            d.type === 'law' ? 'Law School' :
            'Endpoint';

          const justiceList = connectedJustices
            .map(name => `• ${sanitizeLabel(name)}`)
            .join('<br>');

          showTooltip(
            event,
            `<strong>${sanitizeLabel(d.name)}</strong><br>` +
            `${typeLabel}<br><br>${justiceList}`
          );
        })
        .on('mousemove', moveTooltip)
        .on('mouseleave', () => {
          links
            .classed('is-highlighted', false)
            .classed('is-dimmed', false)
            .attr('stroke-width', link => Math.max(0.6, link.width * 0.7));

          hideTooltip();
        });

          node.append('text')
        .attr('x', d => d.x1 + 8)
        .attr('y', d => (d.y0 + d.y1) / 2)
        .attr('dy', '0.35em')
        .attr('text-anchor', 'start')
        .text(d => sanitizeLabel(d.name));
    }

    function buildSankeyGraph(rows, endpointLabel) {
      const SCALE = 0.6;

      const nodes = [];
      const nodeById = new Map();
      const links = [];

      function addNode(id, name, type, personOrder) {
        if (!nodeById.has(id)) {
          const node = {
            id,
            name,
            type,
            order: personOrder
          };
          nodeById.set(id, node);
          nodes.push(node);
        } else {
          nodeById.get(id).order = Math.min(
            nodeById.get(id).order,
            personOrder
          );
        }
      }

      function addLink(source, target, value, personOrder, justice, flowLabel) {
        links.push({
          source,
          target,
          value: value * SCALE,
          personOrder,
          justice,
          flowLabel
        });
      }

      rows.forEach(([justiceRaw, collegeRaw, lawRaw], personOrder) => {
        const justice = justiceRaw.trim();
        const college = normalizeCollege(collegeRaw);
        const lawSchools = splitLawSchools(lawRaw);
        const resolvedLawSchools = lawSchools.length
          ? lawSchools
          : ['Unknown law school'];
        const share = 1 / resolvedLawSchools.length;

        const justiceId = `justice:${justice}`;
        const collegeId = `college:${college}`;
        const endpointId = `endpoint:${endpointLabel}`;

        addNode(justiceId, justice, 'justice', personOrder);
        addNode(collegeId, college, 'college', personOrder);
        addNode(endpointId, endpointLabel, 'endpoint', personOrder);

        const completeFlow =
          `${justice} → ${college} → ${resolvedLawSchools.join('; ')} → ${endpointLabel}`;

        addLink(
          justiceId,
          collegeId,
          1,
          personOrder,
          justice,
          completeFlow
        );

        resolvedLawSchools.forEach(lawSchool => {
          const lawId = `law:${lawSchool}`;

          addNode(lawId, lawSchool, 'law', personOrder);

          addLink(
            collegeId,
            lawId,
            share,
            personOrder,
            justice,
            completeFlow
          );

          addLink(
            lawId,
            endpointId,
            share,
            personOrder,
            justice,
            completeFlow
          );
        });
      });

      return {
        nodes,
        links,
        justiceCount: rows.length,
        collegeCount: nodes.filter(d => d.type === 'college').length,
        lawSchoolCount: nodes.filter(d => d.type === 'law').length
      };
    }

    function normalizeCollege(raw) {
      const cleaned = stripDegreeSuffix(raw || '').trim();
      if (!cleaned) return 'No college listed';
      return COLLEGE_ALIASES.get(cleaned) || cleaned;
    }

    function splitLawSchools(raw) {
      const cleaned = String(raw || '').trim();
      if (!cleaned) return [];
      return cleaned
        .split(';')
        .map(d => stripDegreeSuffix(d).trim())
        .filter(Boolean);
    }

    function stripDegreeSuffix(value) {
      return String(value || '')
        .replace(/\s*\([^)]*\)\s*/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function nodeColor(node, chartColor) {
      return '#111111';
    }

    function linkColor(link, chartColor) {
      return '#aaaaaa';
    }

    function drawColumnLabels(g, innerWidth) {
      const labels = [
        { text: 'Supreme Court Justices', x: 0 },
        { text: 'College', x: innerWidth * 0.34 },
        { text: 'Law School', x: innerWidth * 0.67 },
        { text: 'Supreme Court', x: innerWidth }
      ];

      g.append('g')
        .selectAll('text')
        .data(labels)
        .join('text')
        .attr('class', 'col-label')
        .attr('x', d => d.x)
        .attr('y', 0)
        .attr('text-anchor', d => d.text === 'Supreme Court' ? 'end' : 'start')
        .text(d => d.text);
    }

    function formatValue(value) {
      return Number.isInteger(value) ? value : d3.format('.2f')(value);
    }

    function sanitizeLabel(text) {
      return String(text || '');
    }

    function showTooltip(event, html) {
      tooltip.style('opacity', 1).html(html);
      moveTooltip(event);
    }

    function moveTooltip(event) {
      tooltip
        .style('left', `${event.clientX + 14}px`)
        .style('top', `${event.clientY + 14}px`);
    }

    function hideTooltip() {
      tooltip.style('opacity', 0);
    }
  </script>
</body>
</html>
